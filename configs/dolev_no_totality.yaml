# Scenario 4: No-totality test.
# node0 is a Byzantine broadcaster (partial mode): it only sends to some
# neighbours.  This can cause only a SUBSET of correct nodes to deliver
# the message (f+1=2 paths not reachable for all nodes).

_defaults: &defaults
  f: 1
  optimized: false
  broadcaster: false
  messages: []
  byzantine: false
  byzantine_mode: "passive"
  byzantine_target: ""
  delay_min: 0.0
  delay_max: 0.3

node0:
  # Byzantine broadcaster: only sends to half its neighbours
  f: 1
  optimized: false
  broadcaster: false
  messages: ["Partial byzantine broadcast"]
  byzantine: true
  byzantine_mode: "partial"
  byzantine_target: ""
  delay_min: 0.0
  delay_max: 0.3
  neighbours: [node1, node9, node5]

node1:
  <<: *defaults
  neighbours: [node0, node2, node6]

node2:
  <<: *defaults
  neighbours: [node1, node3, node7]

node3:
  <<: *defaults
  neighbours: [node2, node4, node8]

node4:
  <<: *defaults
  neighbours: [node3, node5, node9]

node5:
  <<: *defaults
  neighbours: [node4, node6, node0]

node6:
  <<: *defaults
  neighbours: [node5, node7, node1]

node7:
  <<: *defaults
  neighbours: [node6, node8, node2]

node8:
  <<: *defaults
  neighbours: [node7, node9, node3]

node9:
  <<: *defaults
  neighbours: [node8, node0, node4]
