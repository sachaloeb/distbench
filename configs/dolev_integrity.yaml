# Scenario 3: RC-Integrity test.
# node8 is Byzantine (impersonate mode): it sends a fake message claiming
# to come from node0.  node0 never broadcasts anything.
# Correct nodes must NOT deliver the fake message (requires f+1=2 disjoint
# paths from node0, but only 1 Byzantine path exists).

_defaults: &defaults
  f: 1
  optimized: false
  broadcaster: false
  messages: []
  byzantine: false
  byzantine_mode: "passive"
  byzantine_target: ""
  delay_min: 0.0
  delay_max: 0.3

node0:
  <<: *defaults
  neighbours: [node1, node9, node5]
  # node0 is honest but does NOT broadcast

node1:
  <<: *defaults
  neighbours: [node0, node2, node6]

node2:
  <<: *defaults
  neighbours: [node1, node3, node7]

node3:
  <<: *defaults
  neighbours: [node2, node4, node8]

node4:
  <<: *defaults
  neighbours: [node3, node5, node9]

node5:
  <<: *defaults
  neighbours: [node4, node6, node0]

node6:
  <<: *defaults
  neighbours: [node5, node7, node1]

node7:
  <<: *defaults
  neighbours: [node6, node8, node2]

node8:
  # Byzantine node: pretends to be node0 (impersonation)
  f: 1
  optimized: false
  broadcaster: false
  messages: []
  byzantine: true
  byzantine_mode: "impersonate"
  byzantine_target: "node0"
  delay_min: 0.0
  delay_max: 0.3
  neighbours: [node7, node9, node3]

node9:
  <<: *defaults
  neighbours: [node8, node0, node4]
