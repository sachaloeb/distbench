# Scenario 3b: Strong RC-Integrity test.
# node0 broadcasts a real message (msg_id=0, content="REAL").
# node8 is Byzantine (impersonate mode): it sends a forged message claiming
# to come from node0 with path=[node0] — this passes the origin check
# (path starts with the claimed sender).
#
# Without the content-keyed state fix (P1), the forged message's path
# ("node0","node8") could combine with the real message's path to form
# f+1=2 disjoint paths, potentially causing FAKE to be delivered.
#
# With the fix: paths are keyed by (sender, msg_id, content), so the FAKE
# and REAL messages have entirely separate state.  The FAKE message only
# ever has 1 path (through node8), never reaching f+1=2.
# The REAL message still delivers normally to all correct nodes.
#
# This config runs with both base AND optimized correct nodes to verify
# both modes.

_defaults: &defaults
  f: 1
  optimized: false
  broadcaster: false
  messages: []
  byzantine: false
  byzantine_mode: "passive"
  byzantine_target: ""
  delay_min: 0.0
  delay_max: 0.3

node0:
  <<: *defaults
  neighbours: [node1, node9, node5]
  broadcaster: true
  messages: ["REAL"]

node1:
  <<: *defaults
  neighbours: [node0, node2, node6]

node2:
  <<: *defaults
  neighbours: [node1, node3, node7]

node3:
  <<: *defaults
  neighbours: [node2, node4, node8]

node4:
  <<: *defaults
  neighbours: [node3, node5, node9]

node5:
  <<: *defaults
  neighbours: [node4, node6, node0]

node6:
  <<: *defaults
  neighbours: [node5, node7, node1]

node7:
  <<: *defaults
  neighbours: [node6, node8, node2]

node8:
  # Byzantine node: sends forged message with path=[node0] to simulate
  # a message that "came through node0" but was actually crafted.
  f: 1
  optimized: false
  broadcaster: false
  messages: []
  byzantine: true
  byzantine_mode: "impersonate"
  byzantine_target: "node0"
  delay_min: 0.0
  delay_max: 0.3
  neighbours: [node7, node9, node3]

node9:
  <<: *defaults
  neighbours: [node8, node0, node4]
